<div class="container">
    <h1 class="header-style">My Interests</h1>
    <div class="interests">
        <div *ngFor="let interest of interests" class="interest">
            <app-svg-icon class="icon" [path]="interest.icon"></app-svg-icon>
            <h3 class="title">{{ interest.title }}</h3>
            <p class="desc">{{ interest.desc }}</p>
        </div>
    </div>
</div>
