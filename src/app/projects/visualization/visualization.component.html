<div class="container">
    <div class="content"
    [innerHTML]="visualizationHTML"
    *ngIf="!visualizationData.error; else error"
    >
    </div>
    <button class="back-button" (click)="back()">Back</button>
</div>
<ng-template #error>
    <div class="container content error">
        <h1>Error</h1>
        <p>{{ visualizationData.error }}</p>
        <a [routerLink]="['/projects']" class="btn-main">Back to Projects</a>
    </div>
</ng-template>
