<div class="container content">
        <div *ngIf="project; else error">
            <div class="project-showcase">
                <div class="left">
                    <h2 class="about-title">{{ project.name }}</h2>
                    <p><em>{{ project.date }}</em></p>
                    <div class="about-para">
                        <p>{{ project.desc }}</p>
                    </div>
                    <div class="button-group">
                        <button (click)="back()" class="btn-main margin-right">Back to Portfolio</button>
                        <a *ngIf="project.hasLink" href="{{ project.link }}" target="_blank" class="btn-outline">View Project</a>
                    </div>
                </div>
                <div class="right">
                    <img class="project-image" src="{{ project.img }}" alt="{{ project.name }}" />
                </div>
            </div>
        </div>
    <ng-template #error>
        <p>Error Works</p>
    </ng-template>
</div>
