<div class="container">
    <div class="content">
        <div class="collage-container">
            <div class="collage-item" 
                 *ngFor="let photo of photos" 
                 [ngClass]="{
                   'wide': photo.size === 'wide',
                   'tall': photo.size === 'tall',
                   'large': photo.size === 'large'
                 }">
              <img [src]="photo.url" [alt]="photo.description">
            </div>
          </div>
    </div>
</div>
